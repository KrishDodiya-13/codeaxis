# Local Postgres for development.
#
# Port 5433, not 5432, deliberately: a machine with PostgreSQL installed natively
# already has 5432 bound, and colliding with it is confusing to diagnose. The
# DATABASE_URL in web/.env uses 5433 to match.
#
#   docker compose up -d db          start
#   docker compose down              stop, keeping data
#   docker compose down -v           stop and delete data
#
# Then, from web/:  npx prisma migrate deploy && npx prisma generate
#
# These credentials are for local development only and are intentionally weak. They
# are never used outside a loopback-bound container.
services:
  db:
    image: postgres:16-alpine
    container_name: brandos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: brandos_dev_pw
      POSTGRES_DB: brandos
    ports:
      # Bound to loopback so the database is not exposed on the network.
      - '127.0.0.1:5433:5432'
    volumes:
      - brandos-pgdata:/var/lib/postgresql/data
    healthcheck:
      # `npx prisma migrate deploy` fails confusingly against a server that is
      # listening but not yet ready, so readiness is a real check, not a sleep.
      test: ['CMD-SHELL', 'pg_isready -U postgres -d brandos']
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  brandos-pgdata:
